approvedGitRepositories:
  - "**"

enableScripts: true

enableTelemetry: false

nodeLinker: node-modules

npmMinimalAgeGate: 0

yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Only Bootstrap's CSS is used (no Bootstrap JS), so Popper is not needed.
packageExtensions:
  bootstrap@*:
    peerDependenciesMeta:
      "@popperjs/core":
        optional: true
