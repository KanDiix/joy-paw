name: Setup
description: Node 24, Yarn 4 (pinned by `packageManager` through Corepack) and the cached dependencies.

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: yarn

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
