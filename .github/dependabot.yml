# Weekly dependency update pull requests, opened against develop (git flow) and checked by the CI.
version: 2
updates:
  - package-ecosystem: npm # also covers Yarn 4 (yarn.lock)
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    # Leave a freshly published version a few days to be yanked or patched before proposing it.
    cooldown:
      default-days: 7
    groups:
      # One PR for all the minor and patch updates; each major update gets its own PR.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
